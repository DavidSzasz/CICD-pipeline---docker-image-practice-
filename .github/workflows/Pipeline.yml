name: CICD pipeline -> docker image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    # --- Automatically find and set the .NET version from your project file ---
    - name: Extract .NET Version
      id: dotnet-version
      run: |
        VERSION=$(grep -oim 1 '<TargetFramework[^>]*>.*net[0-9.]*' src/CICD-pipeline---docker-image-practice-.slnx -r --include="*.csproj" | grep -oim 1 'net[0-9.]*' | sed 's/net//')
        if [ -z "$VERSION" ]; then
          VERSION="10.0"
        fi
        echo "version=$VERSION.x" >> $GITHUB_OUTPUT
        echo "Detected .NET version: $VERSION.x"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ steps.dotnet-version.outputs.version }}

    - name: Restore dependencies
      run: dotnet restore src/CICD-pipeline---docker-image-practice-.slnx
    
    - name: Build
      run: dotnet build src/CICD-pipeline---docker-image-practice-.slnx --no-restore
    
    # --- Generate package and library version report ---
    - name: Generate Dependency Report
      run: dotnet list src/CICD-pipeline---docker-image-practice-.slnx package --include-transitive --format json > dependencies.json

    # --- Upload the report as a workflow artifact ---
    - name: Upload Dependency Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CICD-pipeline---docker-image-practice-dependencies
        path: dependencies.json

  Delivery:
    needs:
      build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    # --- Download the dependency report so Docker can include it ---
    - name: Download Dependency Artifact
      uses: actions/download-artifact@v4
      with:
        name: CICD-pipeline---docker-image-practice-dependencies
        path: .

    # --- Log in to GitHub Container Registry ---
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # --- Build and name your Docker image ---
    - name: Lowercase Repository Name
      id: repo_name
      run: |
        echo "IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.repo_name.outputs.IMAGE_NAME }}:latest
          ${{ steps.repo_name.outputs.IMAGE_NAME }}:${{ github.sha }}